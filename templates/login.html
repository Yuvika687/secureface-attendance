{% extends 'base.html' %}
{% block title %}Login - SecureFace Attendance{% endblock %}

{% block auth_content %}
<div style="text-align:center; margin-bottom:1.5rem;">
    <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:14px; background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.12); margin-bottom:1.25rem;">
        <i class="fa-solid fa-shield-halved" style="font-size:1.5rem; color:var(--accent-emerald);"></i>
    </div>
    <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-primary); margin-bottom:0.3rem;">Log in</h1>
    <p style="color:var(--text-muted); font-size:0.82rem;">SecureFace Attendance</p>
</div>

<form method="POST" action="{{ url_for('login') }}" id="loginForm" style="display:flex; flex-direction:column; gap:1rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="seg-toggle" role="radiogroup" aria-label="Account type">
        <input type="radio" name="role" id="roleStudent" value="student" {% if role != 'admin' %}checked{% endif %}>
        <label for="roleStudent"><i class="fa-regular fa-user"></i> Student</label>
        <input type="radio" name="role" id="roleAdmin" value="admin" {% if role == 'admin' %}checked{% endif %}>
        <label for="roleAdmin"><i class="fa-solid fa-shield-halved"></i> Admin</label>
    </div>

    <div>
        <label for="email" style="display:block; font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.4rem;">Email</label>
        <div style="position:relative;">
            <i class="fa-regular fa-envelope" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem;"></i>
            <input type="email" id="email" name="email" class="form-control" style="padding-left:2.5rem;" required placeholder="name@domain.com" autocomplete="email" value="{{ request.form.get('email', '') }}">
        </div>
    </div>
    <div>
        <label for="password" style="display:block; font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.4rem;">Password</label>
        <div style="position:relative;">
            <i class="fa-solid fa-lock" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem;"></i>
            <input type="password" id="password" name="password" class="form-control" style="padding-left:2.5rem;" required placeholder="••••••••" autocomplete="current-password">
        </div>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn" style="margin-top:0.5rem; padding:0.85rem;">
        <span id="loginBtnText">Log in</span> <i class="fa-solid fa-arrow-right" id="loginBtnIcon"></i>
    </button>
</form>

<div style="text-align:center; margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:0.5rem;">
    <p style="font-size:0.78rem; color:var(--text-muted);" id="registerLine">New student? <a href="{{ url_for('register') }}" style="color:var(--accent-emerald); font-weight:600; text-decoration:none;">Create account</a></p>
    <a href="{{ url_for('how_it_works') }}" style="font-size:0.72rem; color:var(--text-muted); text-decoration:none; font-weight:600;">
        <i class="fa-solid fa-circle-info"></i> How it works
    </a>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function() {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    document.getElementById('loginBtnText').innerText = 'Logging in…';
    document.getElementById('loginBtnIcon').className = 'fa-solid fa-circle-notch fa-spin';
    btn.style.opacity = '0.8';
});
function syncRegisterLine() {
    document.getElementById('registerLine').style.display =
        document.getElementById('roleAdmin').checked ? 'none' : '';
}
document.querySelectorAll('input[name="role"]').forEach(r => r.addEventListener('change', syncRegisterLine));
syncRegisterLine();
</script>
{% endblock %}
