<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Scanner | Face ID</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <style>
        :root {
            --primary-glow: rgba(56, 189, 248, 0.5);
            --success-glow: rgba(52, 211, 153, 0.6);
            --danger-glow: rgba(248, 113, 113, 0.6);
            --glass-bg: rgba(10, 14, 26, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        
        #scanVideo {
            width: 100%; height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
            filter: contrast(1.08) brightness(0.92) saturate(1.15);
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 35%, rgba(0,0,0,0.85) 100%);
            z-index: 2; pointer-events: none;
        }

        .top-nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .logo i { font-size: 1.5rem; color: #10b981; }

        .nav-btns { display: flex; gap: 0.75rem; }

        .auth-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 10px 22px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .auth-btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* Target Reticle */
        .target-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 500px;
            z-index: 5;
            display: flex; justify-content: center; align-items: center;
            transition: left 0.12s linear, top 0.12s linear, width 0.12s linear, height 0.12s linear;
        }
        /* Driven by real detection coordinates (see updateFaceBox()) once a
           face is found -- left/top/width/height are then set inline by JS
           and this rule no longer applies. */
        .target-container.tracking {
            transform: none;
        }

        .bracket {
            position: absolute;
            width: 45px; height: 45px;
            border-color: #10b981;
            border-style: solid;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            border-radius: 10px;
        }
        .tl { top:0; left:0; border-width: 3px 0 0 3px; }
        .tr { top:0; right:0; border-width: 3px 3px 0 0; }
        .bl { bottom:0; left:0; border-width: 0 0 3px 3px; }
        .br { bottom:0; right:0; border-width: 0 3px 3px 0; }

        .scan-laser {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(16, 185, 129, 0.15) 50%, rgba(16, 185, 129, 0.4) 95%, #10b981 100%);
            clip-path: inset(0 0 100% 0);
            animation: scan 2.5s infinite linear;
            z-index: 6;
            border-radius: 10px;
            display: none;
        }
        @keyframes scan {
            0% { clip-path: inset(0 0 100% 0); }
            50% { clip-path: inset(0 0 0 0); }
            100% { clip-path: inset(100% 0 0 0); }
        }

        .target-container.scanning .scan-laser { display: block; }
        
        .target-container.success .bracket { 
            border-color: #34d399; box-shadow: 0 0 30px var(--success-glow);
            transform: scale(1.05); border-radius: 18px;
        }
        .target-container.alert .bracket {
            border-color: #f87171; box-shadow: 0 0 30px var(--danger-glow);
            transform: scale(0.95);
        }
        /* UNCERTAIN: distinct from success (green), alert (red), and "no
           face" -- a reject+retry state, not a hard failure. */
        .target-container.uncertain .bracket {
            border-color: #38bdf8; box-shadow: 0 0 30px var(--primary-glow);
        }

        /* Status Panel */
        .status-panel {
            position: absolute;
            bottom: 7%; left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 18px 35px;
            border-radius: 18px;
            text-align: center;
            z-index: 10;
            min-width: 300px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .status-panel.success { border-color: #34d399; background: rgba(6, 78, 59, 0.6); }
        .status-panel.error { border-color: #f87171; background: rgba(127, 29, 29, 0.6); animation: shake 0.5s; }
        .status-panel.uncertain { border-color: #38bdf8; background: rgba(12, 74, 110, 0.5); }

        .status-title { font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.3px; }
        .status-desc { font-size: 0.88rem; color: #94a3b8; font-weight: 400; }
        
        /* Confidence & Score Meter */
        .meter-row {
            display: flex; gap: 1rem; margin-top: 10px; justify-content: center; flex-wrap: wrap;
        }
        .meter {
            display: flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600; color: #64748b;
        }
        .meter-bar {
            width: 60px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
        }
        .meter-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
        .meter-fill.green { background: #10b981; }
        .meter-fill.yellow { background: #f59e0b; }
        .meter-fill.red { background: #f43f5e; }

        /* Debug Overlay */
        .debug-panel {
            position: absolute;
            top: 100px; left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 16px;
            border-radius: 10px;
            z-index: 15;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.68rem;
            color: #64748b;
            line-height: 1.6;
            min-width: 180px;
            display: none;
        }
        .debug-panel.active { display: block; }
        .debug-panel .val { color: #10b981; font-weight: 700; }
        .debug-panel .fail { color: #f43f5e; }
        .debug-panel .warn { color: #f59e0b; }
        .debug-label { color: #475569; }

        /* Frame counter */
        .frame-counter {
            position: absolute;
            top: 100px; right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 8px;
            z-index: 15;
            font-size: 0.7rem;
            color: #475569;
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%); }
            25% { transform: translateX(-52%); }
            50% { transform: translateX(-48%); }
            75% { transform: translateX(-52%); }
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }

        .blink-prompt {
            animation: pulse-ring 1.2s infinite;
            border-radius: 18px;
        }

        @media (max-width: 768px) {
            .target-container { width: 260px; height: 340px; }
            .top-nav { padding: 15px 20px; flex-direction: column; gap: 12px; }
            .status-panel { bottom: 4%; padding: 14px 22px; min-width: 260px;}
            .debug-panel { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="scanVideo" autoplay muted playsinline></video>
        <div class="vignette"></div>
    </div>

    <div class="top-nav">
        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            <span>SmartFace AI</span>
        </div>
        <div class="nav-btns">
            <a href="{{ url_for('login') }}" class="auth-btn">
                <i class="fa-solid fa-user"></i> Student Login
            </a>
            <a href="{{ url_for('admin_login') }}" class="auth-btn" style="border-color:rgba(139,92,246,0.2);">
                <i class="fa-solid fa-shield-halved" style="color:#8b5cf6;"></i> Admin
            </a>
        </div>
    </div>

    {% if debug_mode %}
    <!-- Dev-only test-category label (FLASK_DEBUG=1 only). Purely descriptive --
         tags each scan_events row with what's being shown to the camera for this
         test run. Never read by the liveness/recognition pipeline. -->
    <div style="position:absolute; bottom:12px; left:12px; z-index:16; max-width:140px;
                background:rgba(0,0,0,0.75); backdrop-filter:blur(10px); border:1px solid rgba(245,158,11,0.3);
                border-radius:8px; padding:5px 8px; font-family:'JetBrains Mono','Consolas',monospace;
                font-size:0.58rem; color:#f59e0b; display:flex; flex-direction:column; gap:3px;">
        <span style="font-weight:700;">TEST LABEL</span>
        <select id="testLabelSelect" style="background:#111; color:#e2e8f0; border:1px solid rgba(245,158,11,0.3); border-radius:5px; padding:2px 4px; font-family:inherit; font-size:0.6rem; max-width:128px;">
            <option value="">(none)</option>
            <option value="real_face">Real face</option>
            <option value="real_face_masked">Real face (masked)</option>
            <option value="printed_photo">Printed photo</option>
            <option value="printed_photo_masked">Printed photo (masked)</option>
            <option value="phone_photo">Phone photo</option>
            <option value="phone_video">Phone video</option>
            <option value="laptop_screen">Laptop screen</option>
            <option value="other">Other (custom)</option>
        </select>
        <input type="text" id="testLabelCustom" placeholder="custom label" maxlength="40"
               style="display:none; background:#111; color:#e2e8f0; border:1px solid rgba(245,158,11,0.3); border-radius:5px; padding:2px 4px; font-family:inherit; font-size:0.6rem; max-width:128px;">
    </div>
    <script>
        (function() {
            const sel = document.getElementById('testLabelSelect');
            const custom = document.getElementById('testLabelCustom');
            const KEY = 'devTestLabel';
            try {
                const saved = localStorage.getItem(KEY) || '';
                if (saved && !Array.from(sel.options).some(o => o.value === saved)) {
                    sel.value = 'other'; custom.value = saved; custom.style.display = 'inline-block';
                } else {
                    sel.value = saved;
                }
            } catch (e) {}
            function currentLabel() {
                return sel.value === 'other' ? custom.value.trim() : sel.value;
            }
            window.getDevTestLabel = currentLabel;
            sel.addEventListener('change', () => {
                custom.style.display = sel.value === 'other' ? 'inline-block' : 'none';
                try { localStorage.setItem(KEY, currentLabel()); } catch (e) {}
            });
            custom.addEventListener('input', () => {
                try { localStorage.setItem(KEY, currentLabel()); } catch (e) {}
            });
        })();
    </script>
    {% endif %}

    <!-- Debug overlay (toggle with 'D' key) -->
    <div class="debug-panel" id="debugPanel">
        <div><span class="debug-label">Confidence:</span> <span id="dbgConf" class="val">—</span></div>
        <div><span class="debug-label">Liveness Score:</span> <span id="dbgSpoof" class="val">—</span></div>
        <div><span class="debug-label">EAR:</span> <span id="dbgEar" class="val">—</span></div>
        <div><span class="debug-label">Eyes:</span> <span id="dbgEyes" class="val">—</span></div>
        <div><span class="debug-label">Depth:</span> <span id="dbgDist" class="val">—</span></div>
        <div><span class="debug-label">State:</span> <span id="dbgState" class="val">—</span></div>
        <div style="margin-top:6px; border-top:1px solid rgba(255,255,255,0.05); padding-top:6px;">
            <span class="debug-label">API Time:</span> <span id="dbgLatency" class="val">—</span>
        </div>
    </div>

    <div class="frame-counter" id="frameCounter">Frames: 0</div>

    <div class="target-container" id="targetBox">
        <div class="bracket tl"></div><div class="bracket tr"></div>
        <div class="bracket bl"></div><div class="bracket br"></div>
        <div class="scan-laser"></div>
    </div>

    <div class="status-panel" id="statusPanel">
        <div class="status-title" id="sTitle">Step into the frame.</div>
        <div class="status-desc" id="sDesc"></div>
        <div class="meter-row" id="meterRow" style="display:none;">
            <div class="meter">
                <span>Confidence</span>
                <div class="meter-bar"><div class="meter-fill green" id="confFill" style="width:0%;"></div></div>
                <span id="confVal">0%</span>
            </div>
            <div class="meter">
                <span>Liveness Score</span>
                <div class="meter-bar"><div class="meter-fill green" id="spoofFill" style="width:0%;"></div></div>
                <span id="spoofVal">0</span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        startCamera("scanVideo");

        const targetBox = document.getElementById("targetBox");
        const statusPanel = document.getElementById("statusPanel");
        const sTitle = document.getElementById("sTitle");
        const sDesc = document.getElementById("sDesc");
        const vid = document.getElementById("scanVideo");
        const meterRow = document.getElementById("meterRow");
        const confFill = document.getElementById("confFill");
        const confVal = document.getElementById("confVal");
        const spoofFill = document.getElementById("spoofFill");
        const spoofVal = document.getElementById("spoofVal");
        const debugPanel = document.getElementById("debugPanel");
        const frameCounter = document.getElementById("frameCounter");

        let isProc = false;
        let eyeWasClosed = false;
        let blinkDetected = false;
        let frameCount = 0;
        let consecutiveRecognitions = 0;  // Track consecutive successful recognitions
        let lastRecognizedUser = null;

        // Debug toggle with D key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                debugPanel.classList.toggle('active');
            }
        });

        function updateDebug(res) {
            // NOTE: res.anti_spoof_score / res.spoof_checks no longer exist --
            // the rule-based anti-spoofing engine was deleted. The trained
            // MobileNetV3-Small model now reports res.p_spoof (0-1,
            // P(spoof)) and res.state (NO_FACE / MULTI_FACE / SPOOF /
            // UNCERTAIN / LIVE). This is a data-wiring fix only -- the full
            // visual redesign of this page is a separate pass.
            const lm = res.liveness_metrics || {};
            const livenessScore = res.p_spoof !== undefined ? Math.round((1 - res.p_spoof) * 100) : 0;
            document.getElementById('dbgConf').textContent = (res.confidence || 0) + '%';
            document.getElementById('dbgSpoof').textContent = res.p_spoof !== undefined ? livenessScore : '—';
            document.getElementById('dbgEar').textContent = lm.ear !== undefined ? lm.ear.toFixed(3) : '—';
            document.getElementById('dbgEyes').textContent = lm.eyes_closed !== undefined ? (lm.eyes_closed ? 'CLOSED' : 'OPEN') : '—';
            document.getElementById('dbgDist').textContent = res.timings && res.timings.total_ms !== undefined ? res.timings.total_ms + 'ms' : '—';
            document.getElementById('dbgState').textContent = res.error ? 'ERROR' : (res.state || '—');

            // Color coding
            const confEl = document.getElementById('dbgConf');
            confEl.className = (res.confidence || 0) > 50 ? 'val' : (res.confidence || 0) > 20 ? 'warn' : 'fail';
            const spoofEl = document.getElementById('dbgSpoof');
            spoofEl.className = livenessScore > 70 ? 'val' : livenessScore > 40 ? 'warn' : 'fail';
        }

        function updateMeters(conf, livenessScore) {
            meterRow.style.display = 'flex';
            confFill.style.width = conf + '%';
            confVal.innerText = conf + '%';
            confFill.className = 'meter-fill ' + (conf > 60 ? 'green' : conf > 30 ? 'yellow' : 'red');

            spoofFill.style.width = livenessScore + '%';
            spoofVal.innerText = livenessScore;
            spoofFill.className = 'meter-fill ' + (livenessScore > 70 ? 'green' : livenessScore > 40 ? 'yellow' : 'red');
        }

        function updateFaceBox(faceBox) {
            // Positions the real target box at the actual detected face
            // location instead of a fixed decorative frame. The captured
            // canvas frame (faceBox.frame_width/height) is a uniform scale
            // of the video's native resolution, and the video is displayed
            // with object-fit:contain (letterboxed) and mirrored via CSS
            // scaleX(-1) -- so the box position must go through the same
            // scale-to-native, scale-to-displayed, then mirror steps.
            if (!faceBox) {
                targetBox.classList.remove('tracking');
                targetBox.style.left = '';
                targetBox.style.top = '';
                targetBox.style.width = '';
                targetBox.style.height = '';
                return;
            }
            const rect = vid.getBoundingClientRect();
            const Vw = vid.videoWidth, Vh = vid.videoHeight;
            if (!Vw || !Vh || !rect.width || !rect.height) return;

            const scale = Math.min(rect.width / Vw, rect.height / Vh);
            const dispW = Vw * scale, dispH = Vh * scale;
            const offX = (rect.width - dispW) / 2, offY = (rect.height - dispH) / 2;

            const toVideoScale = Vw / faceBox.frame_width;
            const nx = faceBox.x * toVideoScale, ny = faceBox.y * toVideoScale;
            const nw = faceBox.width * toVideoScale, nh = faceBox.height * toVideoScale;

            const screenX = offX + nx * scale, screenY = offY + ny * scale;
            const screenW = nw * scale, screenH = nh * scale;
            const mirroredLeft = rect.width - screenX - screenW;

            targetBox.classList.add('tracking');
            targetBox.style.left = mirroredLeft + 'px';
            targetBox.style.top = screenY + 'px';
            targetBox.style.width = screenW + 'px';
            targetBox.style.height = screenH + 'px';
        }

        function setCamStatus(title, desc, state) {
            sTitle.innerHTML = title;
            sDesc.innerHTML = desc;

            targetBox.className = "target-container";
            statusPanel.className = "status-panel";

            if (state === 'scanning') {
                targetBox.classList.add("scanning");
            } else if (state === 'blink') {
                targetBox.classList.add("scanning");
                statusPanel.classList.add("blink-prompt");
            } else if (state === 'success') {
                targetBox.classList.add("success");
                statusPanel.classList.add("success");
            } else if (state === 'uncertain') {
                // Distinct color from both success (green) and alert (red) --
                // and from "no face" (not styled as alert either). Treated as
                // reject + log + retry, not a hard failure.
                targetBox.classList.add("uncertain");
                statusPanel.classList.add("uncertain");
            } else if (state === 'alert' || state === 'unregistered') {
                targetBox.classList.add("alert");
                statusPanel.classList.add("error");
            } else {
                meterRow.style.display = 'none';
            }
        }

        let consecutiveErrors = 0;
        let coldStartTimer = null;
        let coldStartSeconds = 0;

        async function engine() {
            if(!isProc && vid.readyState === 4) {
                isProc = true;
                frameCount++;
                frameCounter.textContent = `Frames: ${frameCount}`;
                
                const b64 = captureFrame("scanVideo");
                if(!b64) { isProc = false; setTimeout(engine, 150); return; }

                const t0 = performance.now();

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout (local)

                    const payload = {image:b64, liveness_verified: blinkDetected};
                    if (window.getDevTestLabel) {
                        const lbl = window.getDevTestLabel();
                        if (lbl) payload.test_label = lbl;
                    }
                    const req = await fetch("{{ url_for('api_recognize_face') }}", {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    const res = await req.json();
                    consecutiveErrors = 0; // Reset on success
                    if (coldStartTimer) { clearInterval(coldStartTimer); coldStartTimer = null; }

                    const latency = Math.round(performance.now() - t0);
                    document.getElementById('dbgLatency').textContent = latency + 'ms';
                    
                    updateDebug(res);

                    if (res.confidence !== undefined || res.p_spoof !== undefined) {
                        const livenessScore = res.p_spoof !== undefined ? Math.round((1 - res.p_spoof) * 100) : 0;
                        updateMeters(res.confidence || 0, livenessScore);
                    }

                    // Handle API error
                    if (res.error) {
                        setCamStatus(
                            '<i class="fa-solid fa-exclamation-triangle" style="color:#f59e0b;"></i> Engine Error',
                            `<span style="color:#f87171;">${res.msg || 'Recognition engine failed'}</span>`,
                            "alert"
                        );
                        updateFaceBox(null);
                    } else if (res.multi_face) {
                        setCamStatus("Multiple Faces", "Only one person at a time.", "alert");
                        updateFaceBox(res.face_box || null);
                        consecutiveRecognitions = 0;
                        lastRecognizedUser = null;
                    } else if(res.spoofing_detected) {
                        setCamStatus("⚠️ Spoof Detected", res.msg || "Spoof detected — please use your real face.", "alert");
                        updateFaceBox(res.face_box || null);
                        eyeWasClosed = false; blinkDetected = false;
                        consecutiveRecognitions = 0;
                        lastRecognizedUser = null;
                    } else if(res.state === "UNCERTAIN") {
                        // Reject + log + retry, not a hard failure -- its own
                        // distinct color (blue), never styled as "alert".
                        // Desc is intentionally blank: the title already
                        // carries the one required message, and repeating it
                        // in the desc was the literal on-screen duplicate.
                        setCamStatus("Hold still — checking again.", "", "uncertain");
                        updateFaceBox(res.face_box || null);
                        eyeWasClosed = false; blinkDetected = false;
                        consecutiveRecognitions = 0;
                        lastRecognizedUser = null;
                    } else if(res.recognized) {
                        if (res.user === lastRecognizedUser) {
                            consecutiveRecognitions++;
                        } else {
                            consecutiveRecognitions = 1;
                            lastRecognizedUser = res.user;
                        }

                        let metrics = res.liveness_metrics || {};

                        // Silent natural-blink check -- no challenge type to
                        // branch on anymore, just watch for one closed->open
                        // eye transition (EAR from the server's real Face
                        // Mesh reading, edge-detected client-side).
                        if (!blinkDetected) {
                            if (metrics.eyes_closed && !eyeWasClosed) {
                                eyeWasClosed = true;
                            } else if (!metrics.eyes_closed && eyeWasClosed) {
                                blinkDetected = true;
                                eyeWasClosed = false;
                            }
                        }

                        if (res.success) {
                            let initials = res.user.substring(0, 2).toUpperCase();
                            let avatar = `<div style="width:56px; height:56px; background:linear-gradient(135deg, #10b981, #06b6d4); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:800; color:#fff; border:3px solid #fff; box-shadow:0 0 25px rgba(16,185,129,0.6); margin:0 auto 10px;">${initials}</div>`;
                            // res.status only exists on a NEWLY-marked attendance
                            // response (see app.py) -- distinguishes a fresh
                            // grant from an already-checked-in welcome-back, so
                            // the heading matches what actually happened instead
                            // of always claiming "Access Granted".
                            let heading = res.status !== undefined ? "Access Granted" : "Welcome Back";
                            setCamStatus(avatar + `<div>${heading}</div>`, `<span style='color:#34d399; font-weight:700; font-size:1.05rem;'>${res.msg}</span>`, "success");
                            updateFaceBox(res.face_box || null);

                            setTimeout(() => {
                                eyeWasClosed = false; blinkDetected = false; isProc = false;
                                consecutiveRecognitions = 0; lastRecognizedUser = null;
                                setCamStatus("Step into the frame.", "", "normal");
                                updateFaceBox(null);
                                setTimeout(engine, 500);
                            }, 3500);
                            return;
                        } else if (!blinkDetected) {
                            // No visible instruction -- waiting silently for
                            // one natural blink (see chat for the honest
                            // replay-attack tradeoff vs. the old random
                            // blink/turn_left/turn_right challenge).
                            setCamStatus("Scanning...", "", "blink");
                            updateFaceBox(res.face_box || null);
                        }
                    } else if(res.face_found) {
                        setCamStatus(
                            "Face Not Recognized",
                            "⚠️ Please <a href='{{ url_for('login') }}' style='color:#10b981; font-weight:bold;'>register</a> first.",
                            "unregistered"
                        );
                        updateFaceBox(res.face_box || null);
                        eyeWasClosed = false; blinkDetected = false;
                        consecutiveRecognitions = 0; lastRecognizedUser = null;
                        setTimeout(() => {
                            isProc = false;
                            setCamStatus("Step into the frame.", "", "normal");
                            updateFaceBox(null);
                            setTimeout(engine, 500);
                        }, 2500);
                        return;
                    } else {
                        setCamStatus("Step into the frame.", "", "normal");
                        updateFaceBox(null);
                        eyeWasClosed = false; blinkDetected = false;
                        consecutiveRecognitions = 0; lastRecognizedUser = null;
                    }
                } catch(e) {
                    consecutiveErrors++;
                    console.warn(`[Scanner] API error #${consecutiveErrors}:`, e.message);

                    if (e.name === 'AbortError') {
                        setCamStatus(
                            '<i class="fa-solid fa-hourglass-half" style="color:#f59e0b;"></i> Processing...',
                            '<span style="color:#94a3b8;">Free tier processing taking longer than expected...</span>',
                            "scanning"
                        );
                        isProc = false;
                        setTimeout(engine, 1000);
                        return;
                    }
                    
                    if (consecutiveErrors >= 2) {
                        // The server may be returning 502s or struggling under load
                        if (!coldStartTimer) {
                            coldStartSeconds = 0;
                            coldStartTimer = setInterval(() => {
                                coldStartSeconds++;
                                const dots = '.'.repeat((coldStartSeconds % 3) + 1);
                                setCamStatus(
                                    '<i class="fa-solid fa-server" style="color:#8b5cf6;"></i> Server Busy' + dots,
                                    `<span style="color:#a78bfa;">API is taking time due to free tier limits — ${coldStartSeconds}s elapsed. Please wait.</span>`,
                                    "scanning"
                                );
                            }, 1000);
                        }
                        // Back off: don't hammer the server, wait 3 seconds between retries
                        isProc = false;
                        setTimeout(engine, 3000);
                        return;
                    } else {
                        setCamStatus(
                            '<i class="fa-solid fa-wifi" style="color:#f59e0b;"></i> Connecting...',
                            '<span style="color:#94a3b8;">Establishing connection to AI engine</span>',
                            "scanning"
                        );
                    }
                }
                isProc = false;
            }
            setTimeout(engine, 150);
        }
        
        // Start with a wake-up ping first, then initialize scanner
        setTimeout(() => {
            setCamStatus(
                '<i class="fa-solid fa-microchip" style="color:#10b981;"></i> Initializing AI...',
                'Connecting to recognition engine',
                "scanning"
            );
            // Send a lightweight ping to wake the server
            fetch("{{ url_for('api_recognize_face') }}", {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image: ''})
            }).catch(() => {});
            
            setTimeout(() => {
                setCamStatus("Step into the frame.", "", "normal");
                engine();
            }, 1500);
        }, 600);
    });
    </script>
</body>
</html>
