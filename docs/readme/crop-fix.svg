<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">The v1 to v2 crop fix</title><desc id="d">Error analysis found v1 was trained on crops framed differently from the live pipeline. Retraining on identical crops: APCER 7.74% to 1.38%, BPCER 3.18% to 1.23%, HTER 5.46% to 1.31%, accuracy 94.54% to 98.69%.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a15"/><stop offset="1" stop-color="#0b1224"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0" r="0.6"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.20"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="1" cy="1" r="0.6"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.18"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-opacity="0.35"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="1280" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="420" fill="url(#bg)"/><rect width="1280" height="420" fill="url(#grid)"/>
<rect width="1280" height="420" fill="url(#g1)"/><rect width="1280" height="420" fill="url(#g2)"/>
<rect x="0" y="0" width="1280" height="2" fill="url(#acc)" opacity="0.8"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/></rect>

<text x="48" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#fbbf24" text-anchor="start" letter-spacing="3">ERROR ANALYSIS → RETRAIN</text>
<text x="46" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc" text-anchor="start" >The crop fix: 94.54% → 98.69%</text>
<text x="48" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start" >v1 trained on differently framed crops than the live pipeline makes. v2 trained on identical crops.</text>
<g opacity="0.95"><ellipse cx="150" cy="250" rx="46" ry="58" fill="#13203f" stroke="#64748b" stroke-dasharray="5 5"/><circle cx="133" cy="240" r="4" fill="#fbbf24"/><circle cx="167" cy="240" r="4" fill="#fbbf24"/><path d="M136 274 q14 10 28 0" stroke="#fbbf24" fill="none" stroke-width="2.5"/></g>
<rect x="40" y="130" width="230" height="210" rx="6" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="10 6"><animate attributeName="x" values="40;40;92;92;40" keyTimes="0;0.2;0.45;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="130;130;177;177;130" keyTimes="0;0.2;0.45;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="width" values="230;230;116;116;230" keyTimes="0;0.2;0.45;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="height" values="210;210;146;146;210" keyTimes="0;0.2;0.45;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="stroke" values="#f87171;#f87171;#34d399;#34d399;#f87171" keyTimes="0;0.2;0.45;0.85;1" dur="6s" repeatCount="indefinite"/></rect>
<g><text x="150" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle" >v1 crop</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.25;0.35;0.9;1" dur="6s" repeatCount="indefinite"/></g>
<g opacity="0"><text x="150" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle" >v2 crop = live crop (face + 25%)</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.45;0.85;0.95" dur="6s" repeatCount="indefinite"/></g>
<text x="540" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="end" >APCER</text>
<text x="540" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end" >attacks accepted</text>
<rect x="560" y="186" width="580.5" height="16" rx="8" fill="#334155" opacity="0.55"/>
<text x="1150.5" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="start" >v1 7.74%</text>
<rect x="560" y="208" width="103.5" height="16" rx="8" fill="url(#acc)"><animate attributeName="width" values="580.5;580.5;103.5" keyTimes="0;0.273;1" begin="0s" dur="2.20s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/></rect>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.750;1" dur="2.40s" begin="0s" fill="freeze"/><text x="673.5" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="800" fill="#5eead4" text-anchor="start" >v2 1.38%</text></g>
<text x="540" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="end" >BPCER</text>
<text x="540" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end" >real faces rejected</text>
<rect x="560" y="256" width="238.5" height="16" rx="8" fill="#334155" opacity="0.55"/>
<text x="808.5" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="start" >v1 3.18%</text>
<rect x="560" y="278" width="92.2" height="16" rx="8" fill="url(#acc)"><animate attributeName="width" values="238.5;238.5;92.2" keyTimes="0;0.347;1" begin="0s" dur="2.45s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/></rect>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.774;1" dur="2.65s" begin="0s" fill="freeze"/><text x="662.25" y="291" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="800" fill="#5eead4" text-anchor="start" >v2 1.23%</text></g>
<text x="540" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="end" >HTER</text>
<text x="540" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end" >average error</text>
<rect x="560" y="326" width="409.5" height="16" rx="8" fill="#334155" opacity="0.55"/>
<text x="979.5" y="339" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="start" >v1 5.46%</text>
<rect x="560" y="348" width="98.2" height="16" rx="8" fill="url(#acc)"><animate attributeName="width" values="409.5;409.5;98.2" keyTimes="0;0.407;1" begin="0s" dur="2.70s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1"/></rect>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.793;1" dur="2.90s" begin="0s" fill="freeze"/><text x="668.25" y="361" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="800" fill="#5eead4" text-anchor="start" >v2 1.31%</text></g>
<text x="560" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start" >Same 3,900-image test set for both models. Accuracy 94.54% → 98.69%; HTER 4× lower.</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="none" stroke="#1e293b"/>
</svg>
