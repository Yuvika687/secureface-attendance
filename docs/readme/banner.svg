<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">SecureFace Attendance</title>
  <desc id="d">Face recognition attendance with a self-trained anti-spoofing liveness model: 98.69% accuracy and 1.31% HTER on a 3,900-image CelebA-Spoof test set, 80.6 ms median scan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a15"/><stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.5"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.55"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset="0.5" stop-color="#5eead4" stop-opacity="0.9"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="oval"><ellipse cx="220" cy="200" rx="92" ry="118"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-opacity="0.45" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>

  <!-- scanner ring -->
  <g fill="none">
    <circle cx="220" cy="200" r="150" stroke="#1e293b" stroke-width="2"/>
    <circle cx="220" cy="200" r="150" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="180 763">
      <animateTransform attributeName="transform" type="rotate" from="0 220 200" to="360 220 200" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="200" r="166" stroke="#334155" stroke-width="1" stroke-dasharray="2 9"/>
    <ellipse cx="220" cy="200" rx="104" ry="130" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse cx="220" cy="200" rx="92" ry="118" fill="#0f1b3a" stroke="#5eead4" stroke-opacity="0.35"/>
  </g>
  <!-- face outline -->
  <g fill="none" stroke="#94a3b8" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="6 6">
    <ellipse cx="220" cy="180" rx="46" ry="58"/>
    <path d="M150 300c18-30 40-38 70-38s52 8 70 38"/>
  </g>
  <g fill="#fbbf24"><circle cx="202" cy="170" r="3.5"/><circle cx="238" cy="170" r="3.5"/><circle cx="220" cy="190" r="3"/><circle cx="206" cy="208" r="3"/><circle cx="234" cy="208" r="3"/></g>
  <!-- scan line -->
  <g clip-path="url(#oval)">
    <rect x="120" y="70" width="200" height="26" fill="url(#scan)" opacity="0.6">
      <animate attributeName="y" values="70;304;70" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- live badge -->
  <g transform="translate(160 340)">
    <rect width="120" height="30" rx="15" fill="#052e2b" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <circle cx="20" cy="15" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="34" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="1.5">LIVE FACE</text>
  </g>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="440" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#5eead4">COMPUTER VISION · ANTI-SPOOFING · FLASK</text>
    <text x="438" y="160" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">SecureFace <tspan fill="url(#accent)">Attendance</tspan></text>
    <text x="440" y="202" font-size="21" fill="#cbd5e1">Face recognition attendance that first checks the face is real:</text>
    <text x="440" y="230" font-size="21" fill="#cbd5e1">a self-trained liveness model stops photos, screens and 3D masks.</text>
  </g>
  <!-- stat chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(440 270)">
      <rect width="180" height="78" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="40" font-size="28" font-weight="800" fill="#5eead4">98.69%</text>
      <text x="18" y="62" font-size="13" fill="#94a3b8">test accuracy</text>
    </g>
    <g transform="translate(636 270)">
      <rect width="180" height="78" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="40" font-size="28" font-weight="800" fill="#7dd3fc">1.31%</text>
      <text x="18" y="62" font-size="13" fill="#94a3b8">HTER (spoof error)</text>
    </g>
    <g transform="translate(832 270)">
      <rect width="180" height="78" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="40" font-size="28" font-weight="800" fill="#93c5fd">80.6 ms</text>
      <text x="18" y="62" font-size="13" fill="#94a3b8">median scan</text>
    </g>
    <g transform="translate(1028 270)">
      <rect width="200" height="78" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="18" y="40" font-size="28" font-weight="800" fill="#c4b5fd">1.0 M</text>
      <text x="18" y="62" font-size="13" fill="#94a3b8">params · MobileNetV3-S</text>
    </g>
  </g>
</svg>
