<title id="t">SecureFace scan pipeline</title><desc id="d">Animated pipeline: camera, BlazeFace, same-face IoU tracking, crop, MobileNetV3 liveness, ArcFace, random head-turn + blink challenge, attendance. Spoofed or uncertain faces stop at the liveness check.</desc>
