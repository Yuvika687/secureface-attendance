<text x="48" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#5eead4">LIVE PIPELINE</text><text x="46" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">How a scan works</text><text x="48" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">Every frame runs this path. A real face reaches attendance; a fake one is stopped before recognition.</text>
