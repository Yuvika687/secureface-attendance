<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
<title id="t">Three parts of SecureFace</title><desc id="d">Scanner for anyone at the kiosk, student pages to register a face and view attendance, admin pages with dashboard, Pipeline View, Grad-CAM, Test Mode and logs.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a15"/><stop offset="1" stop-color="#0b1224"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0" r="0.6"><stop offset="0" stop-color="#5eead4" stop-opacity="0.20"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="1" cy="1" r="0.6"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.18"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-opacity="0.35"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/><rect width="1280" height="360" fill="url(#grid)"/>
<rect width="1280" height="360" fill="url(#g1)"/><rect width="1280" height="360" fill="url(#g2)"/>
<rect x="0" y="0" width="1280" height="2" fill="url(#acc)" opacity="0.8"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/></rect>
<text x="48" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#5eead4">WHAT'S INSIDE</text><text x="46" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">One app, three roles</text><text x="48" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">Hashed passwords · CSRF on every form · Fernet-encrypted face embeddings · audit log</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.250;1" dur="0.80s" begin="0s" fill="freeze"/><rect x="48.0" y="150" width="384.0" height="180" rx="18" fill="#0f172a" stroke="#1e293b"/><rect x="48.0" y="150" width="384.0" height="4" rx="2" fill="#5eead4"><animate attributeName="opacity" values="0.4;1;0.4" begin="0s" dur="3s" repeatCount="indefinite"/></rect><circle cx="402.0" cy="184" r="6" fill="#5eead4"><animate attributeName="r" values="5;8;5" begin="0.0s" dur="2s" repeatCount="indefinite"/></circle><text x="70.0" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="start" >Scanner</text><text x="70.0" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#5eead4" text-anchor="start" >Anyone at the kiosk</text>
<text x="70.0" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Camera → liveness → face → blink</text>
<text x="70.0" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Name + student ID on success</text>
<text x="70.0" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Optional approved devices only</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.429;1" dur="1.05s" begin="0s" fill="freeze"/><rect x="448.0" y="150" width="384.0" height="180" rx="18" fill="#0f172a" stroke="#1e293b"/><rect x="448.0" y="150" width="384.0" height="4" rx="2" fill="#60a5fa"><animate attributeName="opacity" values="0.4;1;0.4" begin="1s" dur="3s" repeatCount="indefinite"/></rect><circle cx="802.0" cy="184" r="6" fill="#60a5fa"><animate attributeName="r" values="5;8;5" begin="0.5s" dur="2s" repeatCount="indefinite"/></circle><text x="470.0" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="start" >Students</text><text x="470.0" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#60a5fa" text-anchor="start" >Logged-in students</text>
<text x="470.0" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Create an account</text>
<text x="470.0" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Register a face once (5 samples)</text>
<text x="470.0" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  See their own attendance</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.538;1" dur="1.30s" begin="0s" fill="freeze"/><rect x="848.0" y="150" width="384.0" height="180" rx="18" fill="#0f172a" stroke="#1e293b"/><rect x="848.0" y="150" width="384.0" height="4" rx="2" fill="#c4b5fd"><animate attributeName="opacity" values="0.4;1;0.4" begin="2s" dur="3s" repeatCount="indefinite"/></rect><circle cx="1202.0" cy="184" r="6" fill="#c4b5fd"><animate attributeName="r" values="5;8;5" begin="1.0s" dur="2s" repeatCount="indefinite"/></circle><text x="870.0" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="start" >Admins</text><text x="870.0" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#c4b5fd" text-anchor="start" >Logged-in admins</text>
<text x="870.0" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Dashboard, students, attendance CSV</text>
<text x="870.0" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Pipeline View with Grad-CAM</text>
<text x="870.0" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >›  Test Mode · Spoof &amp; Scan logs</text>
</g>
</g>
<rect x="0.5" y="0.5" width="1279" height="359" rx="22" fill="none" stroke="#1e293b"/>
</svg>
